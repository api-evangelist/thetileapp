name: Tile (thetileapp)
description: >-
  Tile is a consumer Bluetooth-tracker company whose Tile Mate, Pro, Slim, and
  Sticker devices help people find everyday items such as keys, wallets, bags,
  and phones, backed by the crowd-sourced Tile "Find" network that anonymously
  relays location when another Tile user passes a lost item. Founded in 2012,
  Tile was acquired by Life360 in 2021 and now operates as part of the Life360
  family-safety platform. Tile publishes consumer apps for iOS and Android and a
  support and legal surface, but does not offer an official public developer API,
  developer portal, or SDK; only third-party community libraries wrap its private
  app API. This API Evangelist profile captures the company's public web and
  security-program surface. Surfaced as a portfolio company of Slow Ventures.
